services:
  # Backend API
  - type: web
    name: e-com-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URL
        sync: false  # You'll set this in dashboard
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000

  # Frontend
  - type: web
    name: e-com-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: e-com-api
          property: host